<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cronograma.css">
    <script src="cronograma.js" defer></script>
    <title>Cronograma</title>
</head>
<body>
    <main>
        <div class="btn-container">
            <button class="btn-volver btn-cuadrado">◄</button>
        </div>
        <h1 class="titulo">Cronograma</h1>
        <div class="grilla">
            <div class="barra-opciones">
                <button form="grilla-form" class="btn-submit" type="submit">Guardar Cambios</button>
            </div>
            <form class="grilla-form" id="grilla-form">
                <fieldset class="mes" id="enero">
                    <legend>Enero</legend>
                </fieldset>
                <fieldset class="mes" id="febrero">
                    <legend>Febrero</legend>
                </fieldset>
                <fieldset class="mes" id="marzo">
                    <legend>Marzo</legend>
                </fieldset>
                <fieldset class="mes" id="abril">
                    <legend>Abril</legend>
                </fieldset>
                <fieldset class="mes" id="mayo">
                    <legend>Mayo</legend>
                </fieldset>
                <fieldset class="mes" id="junio">
                    <legend>Junio</legend>
                </fieldset>
                <fieldset class="mes" id="julio">
                    <legend>Julio</legend>
                </fieldset>
                <fieldset class="mes" id="agosto">
                    <legend>Agosto</legend>
                </fieldset>
                <fieldset class="mes" id="septiembre">
                    <legend>Septiembre</legend>
                </fieldset>
                <fieldset class="mes" id="octubre">
                    <legend>Octubre</legend>
                </fieldset>
                <fieldset class="mes" id="noviembre">
                    <legend>Noviembre</legend>
                </fieldset>
                <fieldset class="mes" id="diciembre">
                    <legend>Diciembre</legend>
                </fieldset>
            </form>
        </div>
    </main>
</body>
</html>
